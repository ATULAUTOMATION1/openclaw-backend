services:
  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    restart: always

  agent:
    build:
      context: .
      target: agent
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - TWITTER_API_KEY=${TWITTER_API_KEY}
      # Add other necessary API keys tracking your .env file
    env_file:
      - .env
    restart: always
